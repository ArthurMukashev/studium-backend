services:
  db:
    container_name: studium-db
    image: postgres:17
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=studium
      - PGDATA=/data/postgres
    volumes:
      - pg_data:/data/postgres

volumes:
  pg_data: